<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./src/img/popis-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/main.css">
    <title>POPIS - Focacceria de carne y Specialty Coffe & Bakery</title>
    <script>sessionStorage.clear()</script>

</head>

<body>
    <section class="contenedor" id="menu-idioma">
        <div class="principal">
            <img id="popis-gato" src="./src/img/popis-gato.svg"
                alt="Popis - Focacceria de carne y Specialty Coffe & Bakery">
            <h2 id="typing"></h2>

            <div class="botones" id="botones">
            </div>

            <div id="direccion">
                <a href="https://maps.app.goo.gl/12NpFujeuTSc6AAb8">
                    <p><b>FOCACCERIA DE CARNE Y POLLO</b></p>
                    <p class="descripcion">Carrer del Torrent de l'Olla, 94, Gràcia - Barcelona ➚</p>
                </a>
                <hr>
                <a href="https://maps.app.goo.gl/URNXex1QkYSHWfvt5">
                    <p><b>SPECIALTY COFFEE, BAKERY & BRUNCH</b></p>
                    <p class="descripcion">Carrer de Puigmartí, 2, Gràcia - Barcelona ➚</p>
                </a>
            </div>

            <img id="popis-letras" src="./src/img/popis-letras.svg"
                alt="Popis - Focacceria de carne y Specialty Coffe & Bakery">

        </div>
    </section>

    <section>

        <div class="principal hide" id="menu-local">
            <img id="popis-gato" src="./src/img/popis-gato.svg"
                alt="Popis - Focacceria de carne y Specialty Coffe & Bakery">
            <h2 id="pregunta"></h2>

            <div class="botones">
                <button onclick="menu('focacceria','local')" id="menu-local-focacceria">Focacceria de Carne y Pollo</button>
                <button onclick="menu('bolleria','local')" id="menu-local-bolleria">Specialty Coffee, Bakery & Brunch</button>
                <span class="atras" onclick="recarga()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" fill="currentColor"
                        class="bi bi-arrow-left-circle" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z" />
                    </svg>
                </span>
            </div>
        </div>

    </section>

    <script src="./src/main.js"></script>
    <script>tipear()</script>
    <script>
        // función flecha idioma()
        const idioma = () => (navigator.language || navigator.userLanguage).split('-')[0];

        // textos de los botones según idioma
        const traducciones = {
            es: { menu: "Menú", reserva: "Realizar reserva" },
            en: { menu: "Menu", reserva: "Make a reservation" },
            ca: { menu: "Menú", reserva: "Fer una reserva" }, // catalán
        };

        // obtener idioma actual (por defecto español si no está en la lista)
        const lang = traducciones[idioma()] ? idioma() : "es";

        // generar botones
        const contenedor = document.getElementById("botones");
        contenedor.innerHTML = `
            <button onclick="menu('${lang}','menu')">${traducciones[lang].menu}</button>
            <button onclick="reserva('${lang}')">${traducciones[lang].reserva}</button>
        `;

        const reserva = () => {
            window.open('https://wa.me/34655793149', '_blank')
        }

    </script>
</body>

</html>
