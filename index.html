<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./src/img/popis-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/main.css">
    <title>POPIS - Focacceria de carne ahumada y Specialty Coffe & Bakery</title>
</head>

<body>
    <section class="contenedor">
        <div class="principal">
            <img id="popis-gato" src="./src/img/popis-gato.svg"
                alt="Popis - Focacceria de carne ahumada y Specialty Coffe & Bakery">
            <h2 id="typing"></h2>

            <div class="botones" id="menu-idioma">
                <button onclick="menu('es','menu')">Menú en Español</button>
                <button onclick="menu('en','menu')">Menu in English</button>
                <button onclick="menu('cat','menu')">Menú en Català</button>
            </div>
            <div class="botones hide" id="menu-local">
                <button onclick="menu('focacceria','local')" id="menu-local-focacceria">Focacceria de Carne
                    Ahumada</button>
                <button onclick="menu('bolleria','local')" id="menu-local-bolleria">Specialty Coffe & Bakery</button>
            </div>

            <div id="direccion">
                <a href="https://maps.app.goo.gl/12NpFujeuTSc6AAb8">
                    <p><b>FOCACCERIA DE CARNE AHUMADA</b></p>
                    <p class="descripcion">Carrer del Torrent de l'Olla, 94, Gràcia - Barcelona ➚</p>
                </a>
                <hr>
                <a href="https://maps.app.goo.gl/URNXex1QkYSHWfvt5">
                    <p><b>SPECIALTY COFFEE & BAKERY</b></p>
                    <p class="descripcion">Carrer de Puigmartí, 2, Gràcia - Barcelona ➚</p>
                </a>
            </div>

            <img id="popis-letras" src="./src/img/popis-letras.svg"
                alt="Popis - Focacceria de carne ahumada y Specialty Coffe & Bakery">

        </div>
    </section>

    <script src="./src/main.js"></script>
    <script>tipear()</script>
</body>

</html>
