<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./src/img/popis-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/main.css">
    <title>POPIS - Focacceria de carne ahumada y Specialty Coffe & Bakery</title>
</head>

<body>
    <section class="contenedor">
        <div class="principal">
            <img id="popis-gato" src="./src/img/popis-gato.svg"
                alt="Popis - Focacceria de carne ahumada y Specialty Coffe & Bakery">
            <h2 id="typing"></h2>

            <div class="botones">
                <button>Menú en Español</button>
                <button>Menu in English</button>
                <button>Menu em Português</button>

            </div>
            <a href="https://maps.app.goo.gl/12NpFujeuTSc6AAb8">&#128205; Carrer del Torrent de l'Olla, 94, Gràcia,
                08012 Barcelona, España</a>
            <img id="popis-letras" src="./src/img/popis-letras.svg"
                alt="Popis - Focacceria de carne ahumada y Specialty Coffe & Bakery">

        </div>
    </section>

    <script>
        const palabras = [
            'Bienvenido',   // Español
            'Benvenuto',    // Italiano
            'Welcome',      // Inglés
            'Willkommen',   // Alemán
            'Bienvenue'     // Francés
        ];

        let palabraIndex = 0;
        let letraIndex = 0;
        const velocidad = 150; // velocidad de tipeo
        const pausaEntrePalabras = 1500;

        const typingElement = document.getElementById('typing');

        function tipear() {
            if (letraIndex < palabras[palabraIndex].length) {
                typingElement.textContent += palabras[palabraIndex].charAt(letraIndex);
                letraIndex++;
                setTimeout(tipear, velocidad);
            } else {
                // Pausa y luego borrar para la siguiente palabra
                setTimeout(() => {
                    borrar();
                }, pausaEntrePalabras);
            }
        }

        function borrar() {
            if (letraIndex > 0) {
                typingElement.textContent = palabras[palabraIndex].substring(0, letraIndex - 1);
                letraIndex--;
                setTimeout(borrar, velocidad / 2);
            } else {
                // Siguiente palabra
                palabraIndex = (palabraIndex + 1) % palabras.length;
                setTimeout(tipear, velocidad);
            }
        }

        tipear();
    </script>

</body>

</html>
